[tool.poetry]
name = "pdf-parse-transform"
version = "0.1.0"
description = "A Python FastAPI/FastMCP 2.0 app for PDF parsing and transformation"
authors = ["SteynSean11"]
readme = "README.md"
license = "MIT"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = ">=3.10"
fastapi = "0.115.0"
uvicorn = {version = "0.32.0", extras = ["standard"]}
python-multipart = "0.0.18"
pydantic = "2.9.2"
pydantic-settings = "2.5.2"
mcp = "1.10.0"
PyPDF2 = "3.0.1"
pdfplumber = "0.11.4"
pdf2image = "1.17.0"
pytesseract = "0.3.13"
Pillow = "10.4.0"
pandas = "2.2.3"
lxml = "5.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "8.3.3"
pytest-asyncio = "0.24.0"
httpx = "0.27.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"