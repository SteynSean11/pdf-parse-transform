[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-parse-transform"
version = "0.1.0"
description = "A Python FastAPI/FastMCP 2.0 app for PDF parsing and transformation"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "SteynSean11"}
]
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "python-multipart==0.0.18",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "mcp==1.10.0",
    "PyPDF2==3.0.1",
    "pdfplumber==0.11.4",
    "pdf2image==1.17.0",
    "pytesseract==0.3.13",
    "Pillow==10.4.0",
    "pandas==2.2.3",
    "lxml==5.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "httpx==0.27.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
